name: eval-gate-and-deploy

# Assignment 2, sections 2.4 (regression gate) and 2.6 (AWS deploy).
#
# The needs: chain IS the gate -- build-and-push needs eval-gate, deploy needs
# build-and-push. Nothing downstream runs if evals/combined_score.py --gate exits
# non-zero. No conditional logic in this YAML; pass/fail lives entirely in that
# Python script (evals/combined_score.py), per the assignment's own build guide.
#
# HOW TO DEMO A LIVE REGRESSED PUSH (assignment 2.4's required live-block demo):
# add `AGENT_REGRESSED: "true"` to eval-gate's `env:` block below (one line), push
# that commit, watch this workflow run and fail on GitHub -- then revert the line.
# harness/graph.py reads this exact env var to strip lookup_order out of the
# tools the agent can call; see that file's own comment for the mechanism.
# workflow_dispatch's agent_regressed input below does the same thing without a
# commit, for quick manual testing.

on:
  push:
    # This repo's actual convention (not the assignment's generic main/
    # assignment-2 example) -- w2a-deploy is this session's working branch,
    # w1a-harness is what PR #1 already targets. Add a branch name here if work
    # moves to a new one later.
    branches: ["w1a-harness", "w2a-deploy"]
  # Deliberately NO pull_request trigger. PR #1 (w2a-deploy -> w1a-harness) is a
  # stacked branch pushed to directly, not an independent fork/branch -- its
  # pull_request:synchronize event fires from the exact same commit the push
  # event already tested, so a pull_request trigger here would just re-run the
  # entire 15-ticket trajectory+judge eval suite a second time (real LLM cost,
  # real minutes) for zero new information. Confirmed live: this doubled
  # eval-gate's real API spend on every push with no informational benefit, and
  # separately caused build-and-push/deploy to race each other before that job
  # got its own push-only guard below (see that comment). Not fully verified:
  # whether the push-triggered run's result still surfaces on the PR's own
  # "Checks" page without a pull_request trigger -- if that turns out to
  # matter, revisit rather than assume.
  workflow_dispatch:
    inputs:
      agent_regressed:
        description: "Run eval-gate against the deliberately regressed agent (no lookup_order tool)"
        type: boolean
        default: false

permissions:
  id-token: write   # required for OIDC -- every AWS-touching job below authenticates this way, no static AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY anywhere in this repo
  contents: read

env:
  APP_NAME: dubba

jobs:
  # ---------------------------------------------------------------
  # The regression gate. Nothing downstream of this job runs unless the agent's
  # real, combined trajectory+judge score (evals/combined_score.py) holds up
  # against the stored baseline (evals/baseline.json). Runs against a fresh
  # Postgres+pgvector service container -- same image as docker-compose.yml, so
  # this exercises the real RAG/checkpoint/tickets code paths, not a mock.
  # ---------------------------------------------------------------
  eval-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dubba
          POSTGRES_PASSWORD: dubba
          POSTGRES_DB: dubba
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dubba -d dubba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch secrets from SSM Parameter Store
        # LLM provider keys live in SSM (infra/push-secrets-to-ssm.sh) -- fetched
        # here via the OIDC role above, never stored as a GitHub Actions Secret.
        # Langfuse is deliberately NOT fetched here: the SDK degrades gracefully
        # with no credentials set (confirmed -- logs a warning, swaps in a no-op
        # tracer, never raises), and eval-gate's actual job (comparing the real
        # combined score to baseline) doesn't depend on traces landing anywhere.
        # Langfuse EC2 stays private, reachable by your own IP and later by the
        # deployed ECS agent -- not by CI. See log/DECISIONS.md.
        #
        # ::add-mask:: is required here, not optional -- GitHub's automatic log
        # redaction ONLY knows to hide values sourced from the `secrets.*`
        # context. These values come from AWS SSM via our own `aws` call, so
        # GitHub has no idea they're sensitive; without an explicit mask, a
        # LATER step's own standard `uses:`-action log dump (e.g. a "Post"
        # cleanup phase, which runs at the end of the job after these are
        # already in $GITHUB_ENV) could print them in plaintext. See
        # log/DECISIONS.md for the real run that surfaced this.
        run: |
          ANTHROPIC_KEY=$(aws ssm get-parameter --name /dubba/anthropic-api-key --with-decryption --query Parameter.Value --output text)
          GROQ_KEY=$(aws ssm get-parameter --name /dubba/groq-api-key --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$ANTHROPIC_KEY"
          echo "::add-mask::$GROQ_KEY"
          {
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY"
            echo "GROQ_API_KEY=$GROQ_KEY"
          } >> "$GITHUB_ENV"

      - name: Run regression eval gate
        env:
          DATABASE_URL: postgresql://dubba:dubba@localhost:5433/dubba
          AGENT_REGRESSED: ${{ inputs.agent_regressed || 'false' }}
        run: python evals/combined_score.py --gate

  # ---------------------------------------------------------------
  # Placeholder AWS resource values below (vars.ECR_REPOSITORY / AWS_REGION /
  # AWS_DEPLOY_ROLE_ARN / ECS_*) -- structurally complete now, functional once
  # section 2.6's ECR repo / ECS cluster / OIDC role actually exist. Set the real
  # values as GitHub repo Variables (Settings -> Secrets and variables -> Actions
  # -> Variables) then; no code change needed here. See log/loophole.md.
  # ---------------------------------------------------------------
  build-and-push:
    needs: eval-gate
    # push only -- PR #1 (w2a-deploy -> w1a-harness) being open means every push
    # to w2a-deploy ALSO fires a pull_request:synchronize event (a synthetic
    # merge-commit build, not the real commit), which used to run this job too
    # -- two builds racing to deploy to the same ECS service from the same
    # push. Confirmed live: one run's deploy step reported a false circuit-
    # breaker rollback because the OTHER run's deployment superseded it
    # mid-stabilization, even though the app itself never failed a health
    # check. eval-gate still runs on both (a real, useful PR status check);
    # only the actual deploy path is push-only now. See log/DECISIONS.md.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          # Tagged by commit SHA, not latest-only -- assignment section 2.6.1
          # requires a real audit trail back to the commit that produced an image.
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    # push only -- see build-and-push's own comment above. Explicit here too,
    # not just relying on build-and-push being skipped to cascade -- makes the
    # intent unambiguous on read, not just an implicit consequence.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
