AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Assignment 2, section 2.6 -- part 1 of 2. Adds the private-subnet networking
  RDS needs (the existing VPC, vpc-01bf8f177b6df0109, only has public subnets --
  it hosts infra/langfuse-ec2.yaml's instance), a private RDS PostgreSQL+pgvector
  instance replacing the local Docker Postgres, and the ECR repository images get
  pushed to. Deployed FIRST, before infra/aws-ecs-alb.yaml (part 2) -- ECS needs a
  real image already in ECR before its service can report healthy, and ECR has to
  exist before anything can be pushed to it, so this genuinely has to come first,
  not just "for tidiness". See infra/aws-ecs-alb.yaml's own description.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The existing VPC (same one infra/langfuse-ec2.yaml deployed into).
  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >
      RDS master password -- generate your own (e.g. `openssl rand -hex 16`) and
      pass it here. Not auto-generated by this template (unlike Langfuse EC2's
      secrets) because it needs to end up in a single DATABASE_URL connection
      string the app already expects -- see README.md for the post-deploy step
      that builds that string and pushes it to SSM.

Resources:
  # --- Private subnets, 2 AZs, purely for RDS's own subnet-group requirement.
  # ECS itself stays in the VPC's EXISTING public subnets (assignment section 2.6
  # decision: public subnet + security-group-locked-to-the-ALB, not a NAT Gateway
  # -- see log/DECISIONS.md). These subnets have NO route to the internet gateway
  # at all -- genuinely private, matching section 2.6.2's explicit requirement.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.48.0/20
      AvailabilityZone: ap-south-1a
      Tags: [{ Key: Name, Value: dubba-rds-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 172.31.64.0/20
      AvailabilityZone: ap-south-1b
      Tags: [{ Key: Name, Value: dubba-rds-private-b }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: dubba-rds-private-rt }]
    # Deliberately no route added here -- only the VPC's own implicit "local"
    # route exists by default. No route to the internet gateway means these
    # subnets have no path in or out to the public internet at all.

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the dubba RDS instance -- no internet route.
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # Inbound locked to the ECS task's security group ONLY (infra/aws-ecs-alb.yaml
  # exports it) -- never 0.0.0.0/0, per section 2.6.2's explicit requirement.
  # Starts with an empty ingress list; aws-ecs-alb.yaml adds the real rule once
  # the ECS task security group actually exists (it can't exist yet -- this
  # template deploys first).
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL -- inbound 5432 restricted to the ECS task security group only, added by infra/aws-ecs-alb.yaml.
      VpcId: !Ref VpcId

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: dubba-rds
      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: dubba
      MasterUsername: dubba
      MasterUserPassword: !Ref DBMasterPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref RDSSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0  # teaching deployment, torn down after use -- no backup retention needed
      Tags: [{ Key: Name, Value: dubba-rds }]
    # Single-AZ, no read replica, smallest instance class that runs -- section
    # 2.6.2's explicit ask, not an oversight. pgvector ships as an allow-listed
    # extension on RDS Postgres 15.2+/16.x -- `CREATE EXTENSION IF NOT EXISTS
    # vector` (already what rag/store.py's connect() runs) works with no extra
    # RDS-side configuration.

  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dubba
      ImageTagMutability: IMMUTABLE
      # Commit-SHA tags are never reused, so IMMUTABLE costs nothing and blocks
      # accidentally overwriting a real, already-deployed tag -- section 2.6.1's
      # audit-trail requirement, enforced structurally, not just by convention.
      EmptyOnDelete: true
      # Lets `aws cloudformation delete-stack` actually remove this repo even if
      # images are still in it -- the alternative is manually emptying it first
      # before every teardown, which is exactly the kind of step section 2.6.5
      # warns gets forgotten.

  # Assignment 3 -- the HITL approval queue's production backend (see
  # refunds/approval_gate.py's DynamoDBStore; JsonFileStore is the local-dev
  # equivalent, selected by HITL_STORE_BACKEND). PAY_PER_REQUEST, not
  # provisioned capacity -- this app's refund volume never justifies planning
  # RCU/WCU ahead of time. No GSI on order_id/status (get_active_for_resource/
  # all_pending scan instead) -- fine at this app's scale, see log/loophole.md.
  HitlApprovalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ordercare-hitl-approvals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action_id
          AttributeType: S
      KeySchema:
        - AttributeName: action_id
          KeyType: HASH

Outputs:
  PrivateSubnetIds:
    Description: For infra/aws-ecs-alb.yaml reference if ever needed (RDS subnet group only, ECS does not use these).
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  RDSSecurityGroupId:
    Description: infra/aws-ecs-alb.yaml adds an ingress rule here once the ECS task security group exists.
    Value: !Ref RDSSecurityGroup
  RDSEndpoint:
    Description: RDS hostname -- combine with DBMasterPassword to build DATABASE_URL (see README.md).
    Value: !GetAtt RDSInstance.Endpoint.Address
  RDSPort:
    Value: !GetAtt RDSInstance.Endpoint.Port
  ECRRepositoryUri:
    Description: Push images here (docker build/tag/push) -- needed before infra/aws-ecs-alb.yaml can deploy.
    Value: !GetAtt ECRRepository.RepositoryUri
  HitlApprovalsTableArn:
    Description: infra/aws-ecs-alb.yaml's TaskRole gets DynamoDB access scoped to this ARN.
    Value: !GetAtt HitlApprovalsTable.Arn
